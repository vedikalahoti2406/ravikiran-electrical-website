
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Ravikiran Electrical</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .admin-panel {
      max-width: 900px;
      margin: 35px auto;
      padding: 25px;
      background: #fff;
      color: #171717;
      border-radius: 12px;
      box-shadow: 0 5px 25px #0002;
    }

    .admin-panel input,
    .admin-panel textarea,
    .admin-panel select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 6px;
    }

    .admin-panel button {
      padding: 12px 18px;
      margin: 5px;
      background: #171717;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .dashboard {
      display: none;
    }

    .product-row {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .product-row img {
      width: 100px;
      height: 80px;
      object-fit: contain;
    }

    #loginMessage {
      color: #b00020;
    }
  </style>
</head>

<body class="admin-page">

<header class="admin-header">
  <a href="index.html" class="admin-brand">
    <span class="admin-logo">R⚡</span>
    <div>
      <h2>RAVIKIRAN</h2>
      <p>ELECTRICAL</p>
    </div>
  </a>
  <a href="index.html" class="back-home">Back to Website</a>
</header>

<main class="admin-container">

  <section class="admin-panel" id="loginSection">
    <h1>Owner Login</h1>
    <p>Sign in to manage Ravikiran Electrical products.</p>

    <form id="loginForm">
      <label>Email Address</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <button type="submit" id="loginButton">SIGN IN</button>
    </form>

    <p id="loginMessage"></p>
  </section>

  <section class="admin-panel dashboard" id="dashboard">

    <h1>Admin Dashboard</h1>
    <p>Welcome to Ravikiran Electrical product management.</p>

    <button id="logoutButton">LOG OUT</button>

    <hr>

    <h2>Add New Product</h2>

    <form id="productForm">

      <label>Product Name</label>
      <input type="text" id="productName" required>

      <label>Category</label>
      <select id="productCategory" required>
        <option value="">Select Category</option>
        <option>Fans</option>
        <option>Lights</option>
        <option>Wires & Cables</option>
        <option>Switches</option>
        <option>MCB & Electrical Boards</option>
        <option>Pipes & Fittings</option>
        <option>Other electrical products</option>
      </select>

      <label>Description</label>
      <textarea id="productDescription" required></textarea>

      <label>Product Image URL</label>
      <input type="url" id="productImage" placeholder="https://example.com/image.jpg">

      <button type="submit">ADD PRODUCT</button>
    </form>

    <p id="productMessage"></p>

    <hr>

    <h2>Existing Products</h2>
    <div id="productList">Loading products...</div>

  </section>

</main>

<script type="module">
  import { auth, db } from "./firebase.js";

  import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

  const loginSection = document.getElementById("loginSection");
  const dashboard = document.getElementById("dashboard");
  const loginForm = document.getElementById("loginForm");
  const loginMessage = document.getElementById("loginMessage");
  const productForm = document.getElementById("productForm");
  const productMessage = document.getElementById("productMessage");
  const productList = document.getElementById("productList");

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    loginMessage.textContent = "Signing in...";

    try {
      await signInWithEmailAndPassword(
        auth,
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );
    } catch (error) {
      console.error(error);
      loginMessage.textContent = "Login failed: " + error.code;
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      loginSection.style.display = "none";
      dashboard.style.display = "block";
      await loadProducts();
    } else {
      loginSection.style.display = "block";
      dashboard.style.display = "none";
    }
  });

  document.getElementById("logoutButton").addEventListener("click", async () => {
    await signOut(auth);
  });

  productForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    productMessage.textContent = "Adding product...";

    try {
      await addDoc(collection(db, "products"), {
        name: document.getElementById("productName").value.trim(),
        category: document.getElementById("productCategory").value,
        description: document.getElementById("productDescription").value.trim(),
        image: document.getElementById("productImage").value.trim(),
        createdAt: new Date()
      });

      productForm.reset();
      productMessage.textContent = "Product added successfully!";
      await loadProducts();

    } catch (error) {
      console.error(error);
      productMessage.textContent = "Could not add product: " + error.code;
    }
  });

  async function loadProducts() {
    productList.textContent = "Loading products...";

    try {
      const snapshot = await getDocs(collection(db, "products"));

      productList.innerHTML = "";

      if (snapshot.empty) {
        productList.textContent = "No products added yet.";
        return;
      }

      snapshot.forEach((item) => {
        const product = item.data();

        const row = document.createElement("div");
        row.className = "product-row";

        const name = document.createElement("h3");
        name.textContent = product.name || "";

        const category = document.createElement("p");
        category.textContent = product.category || "";

        const description = document.createElement("p");
        description.textContent = product.description || "";

        row.append(name, category, description);

        if (product.image) {
          const img = document.createElement("img");
          img.src = product.image;
          img.alt = product.name || "Product image";
          row.appendChild(img);
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "DELETE";

        deleteButton.addEventListener("click", async () => {
          if (confirm("Are you sure you want to delete this product?")) {
            try {
              await deleteDoc(doc(db, "products", item.id));
              await loadProducts();
            } catch (error) {
              alert("Delete failed: " + error.code);
            }
          }
        });

        row.appendChild(deleteButton);
        productList.appendChild(row);
      });

    } catch (error) {
      console.error(error);
      productList.textContent = "Could not load products: " + error.code;
    }
  }
</script>

</body>
</html>
